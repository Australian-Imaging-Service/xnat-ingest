# Like minimal-dicom.yaml, with a deidentify stage inserted between assign and
# upload. --reid-dir is deliberately omitted: the original<->deidentified mapping
# is computed and then discarded rather than written to disk. Add reid_dir (and
# optionally reid_encrypt_key) back if re-identifying data later needs to be
# possible - see docs/source/how_to/deidentify.rst.

name: dicom-deidentify

params:
  input_dir:
    description: "Root directory of the scanner export to ingest"
  spec_dir:
    description: "Directory of project-specific deidentification specs"
    default: /etc/xnat-ingest/deid-specs
  xnat_server:
    description: "URL of the XNAT server to upload to"
  xnat_user:
    description: "XNAT username"
  xnat_password:
    description: "XNAT password"
    secret: true

stages:
  - name: group
    command: group
    args:
      input_paths: ["${input_dir}"]

  - name: assign
    command: assign
    input: group
    args:
      project: StudyComments
      subject: PatientID
      session: AccessionNumber

  - name: deidentify
    command: deidentify
    input: assign
    args:
      spec_dir: "${spec_dir}"
      # reid_dir: /var/lib/xnat-ingest/reid   # uncomment to keep the mapping
      # reid_encrypt_key: ${REID_ENCRYPT_KEY} # only meaningful alongside reid_dir

  - name: upload
    command: upload
    input: deidentify
    args:
      server: "${xnat_server}"
      user: "${xnat_user}"
      password: "${xnat_password}"
