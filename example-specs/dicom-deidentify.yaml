# Like minimal-dicom.yaml, with a deidentify stage inserted between assign and
# upload. deidentify() (this branch) requires a reid_dir to write the original
# <-> deidentified mapping to - see docs/source/how_to/deidentify.rst. Add
# reid_encrypt_key too if that mapping should be encrypted at rest.

name: dicom-deidentify

params:
  orthanc_url:
    description: "URL of the Orthanc instance to pull DICOM sessions from"
  orthanc_store_dir:
    description: "Orthanc's StorageDirectory, as mounted in this container"
  orthanc_user:
    description: "Orthanc username"
  orthanc_password:
    description: "Orthanc password"
    secret: true
  spec_dir:
    description: "Directory of project-specific deidentification specs"
    default: /etc/xnat-ingest/deid-specs
  reid_dir:
    description: "Directory to write the original<->deidentified mapping to"
  reid_encrypt_key:
    description: "Key to encrypt the reid mapping at rest with (Fernet.generate_key())"
    secret: true
  xnat_server:
    description: "URL of the XNAT server to upload to"
  xnat_user:
    description: "XNAT username"
  xnat_password:
    description: "XNAT password"
    secret: true

stages:
  - name: group
    command: group-orthanc
    args:
      url: "${orthanc_url}"
      store_dir: "${orthanc_store_dir}"
      user: "${orthanc_user}"
      password: "${orthanc_password}"

  - name: assign
    command: assign
    input: group
    args:
      project: StudyComments
      subject: PatientID
      session: AccessionNumber

  - name: deidentify
    command: deidentify
    input: assign
    args:
      spec_dir: "${spec_dir}"
      reid_dir: "${reid_dir}"
      reid_encrypt_key: "${reid_encrypt_key}"

  - name: upload
    command: upload
    input: deidentify
    args:
      server: "${xnat_server}"
      user: "${xnat_user}"
      password: "${xnat_password}"
