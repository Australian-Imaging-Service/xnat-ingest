# The smallest useful xnat-ingest workflow: group-orthanc -> assign -> upload,
# every default left in place. Suits a plain DICOM workflow pulling sessions
# straight from an Orthanc PACS instance (most DICOM workflows do) where
# StudyInstanceUID/SeriesNumber/PatientID/AccessionNumber already say everything
# needed. For a plain filesystem export instead of Orthanc, swap the first
# stage's 'command: group-orthanc' for 'command: group' with an 'input_paths:'
# arg - see associate-sidecars.yaml/scheduled-scanner-drop.yaml for that form.
#
# 'params:' declares exactly what this workflow needs supplied per-deployment -
# 'xnat-ingest workflow check minimal-dicom.yaml' prints them. A param with no
# 'default:' is required: set via a same-named environment variable (e.g. a k8s
# Secret mounted with env:/envFrom:, which is how the *_password params are
# meant to reach this) or '--param name=value' on the CLI, which always wins if
# both are given.
#
# Where each stage's output is staged is a separate concern from any of this -
# see '--work-dir' on 'workflow run'/'serve'/'deploy' (not a spec/params field).

name: minimal-dicom

params:
  orthanc_url:
    description: "URL of the Orthanc instance to pull DICOM sessions from"
  orthanc_store_dir:
    description: "Orthanc's StorageDirectory, as mounted in this container"
  orthanc_user:
    description: "Orthanc username"
  orthanc_password:
    description: "Orthanc password"
    secret: true
  xnat_server:
    description: "URL of the XNAT server to upload to"
  xnat_user:
    description: "XNAT username"
  xnat_password:
    description: "XNAT password"
    secret: true

stages:
  - name: group
    command: group-orthanc
    args:
      url: "${orthanc_url}"
      store_dir: "${orthanc_store_dir}"
      user: "${orthanc_user}"
      password: "${orthanc_password}"
      # datatypes/session/scan all default to DICOM (medimage/dicom-series,
      # StudyInstanceUID, SeriesNumber) - nothing else needed here.

  - name: assign
    command: assign
    input: group
    args:
      project: StudyComments
      subject: PatientID
      session: AccessionNumber

  - name: upload
    command: upload
    input: assign
    args:
      # Explicit on the stage that actually needs them, not a shared top-level
      # block - keeps the spec format backend-agnostic for a future non-XNAT
      # upload stage.
      server: "${xnat_server}"
      user: "${xnat_user}"
      password: "${xnat_password}"
